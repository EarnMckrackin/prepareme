<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grayscale Lab — PPM Mastery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
    :root {
        --bg-deep: #0b0d13;
        --bg-base: #111318;
        --bg-surface: #191c24;
        --bg-elevated: #21252f;
        --bg-hover: #282d3a;
        --border: #272b38;
        --border-active: #3a4055;

        --text-1: #e6eaf3;
        --text-2: #8b92a8;
        --text-3: #5a6178;
        --text-inv: #111318;

        --accent: #7b6cf6;
        --accent-hover: #9589ff;
        --accent-soft: rgba(123,108,246,.10);
        --accent-muted: rgba(123,108,246,.25);
        --warm: #f0a030;
        --warm-soft: rgba(240,160,48,.10);
        --warm-muted: rgba(240,160,48,.30);
        --success: #34d399;
        --success-soft: rgba(52,211,153,.10);
        --error: #f87171;
        --error-soft: rgba(248,113,113,.10);
        --info: #60a5fa;
        --info-soft: rgba(96,165,250,.10);

        --font-display: 'Source Serif 4', Georgia, serif;
        --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-xl: 22px;
        --r-pill: 100px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font-body);
        background: var(--bg-deep);
        color: var(--text-1);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

    /* Typography */
    h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.25; }
    code, pre { font-family: var(--font-mono); }

    /* Utility */
    .mono { font-family: var(--font-mono); }
    .serif { font-family: var(--font-display); }

    /* Focus */
    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
    }

    /* Transitions */
    .t-all { transition: all 180ms ease-out; }
    .t-colors { transition: color 150ms, background 150ms, border-color 150ms, box-shadow 150ms; }

    /* Code blocks */
    .code-block {
        background: var(--bg-deep);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        padding: 16px 20px;
        font-size: 13px;
        line-height: 1.7;
        overflow-x: auto;
        color: var(--text-2);
        white-space: pre;
        tab-size: 4;
    }
    .code-block .kw { color: #c792ea; }
    .code-block .fn { color: #82aaff; }
    .code-block .str { color: #c3e88d; }
    .code-block .num { color: #f78c6c; }
    .code-block .cm { color: #546e7a; font-style: italic; }
    .code-block .op { color: #89ddff; }
    .code-block .var { color: #e6eaf3; }
    .code-block .dec { color: #ffcb6b; }
    .code-block .param { color: #f07178; }
    .code-block .cls { color: #ffcb6b; }

    /* Fade in animation */
    .fade-up, .fade-in { opacity: 1; }

    /* Progress ring */
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring__bg { stroke: var(--border); }
    .progress-ring__fill { stroke: var(--accent); transition: stroke-dashoffset 600ms ease-out; stroke-linecap: round; }

    /* Pill button */
    .pill-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 18px;
        border-radius: var(--r-pill);
        border: 1px solid var(--border);
        background: var(--bg-surface);
        color: var(--text-1);
        font-family: var(--font-body);
        font-size: 13px; font-weight: 600;
        cursor: pointer;
        transition: all 150ms;
    }
    .pill-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .pill-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pill-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .pill-btn:disabled { opacity: .35; cursor: not-allowed; }
    .pill-btn.sm { padding: 5px 12px; font-size: 12px; }
    .pill-btn.success { background: var(--success); border-color: var(--success); color: var(--text-inv); }

    /* Mastery dot */
    .mastery-dot {
        width: 8px; height: 8px; border-radius: 50%;
        flex-shrink: 0;
        transition: background 300ms, box-shadow 300ms;
    }
    .mastery-dot.unknown { background: var(--border); }
    .mastery-dot.learning { background: var(--warm); box-shadow: 0 0 6px var(--warm-muted); }
    .mastery-dot.mastered { background: var(--success); box-shadow: 0 0 6px rgba(52,211,153,.3); }

    /* Eyebrow */
    .eyebrow {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--text-3);
    }

    /* Select none for interactive elements */
    button, [role="button"] { user-select: none; }

    /* Print */
    @media print { body { background: #fff; color: #000; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script>window.DEFAULT_COURSE_ID = 'grayscale-ppm-mastery';</script>
    <script type="text/babel" src="grayscale-lab-data.jsx"></script>
    <script type="text/babel" src="lab-engine.jsx"></script>
    <script type="text/babel" src="lab-dashboard.jsx"></script>
    <script type="text/babel" src="lab-app.jsx"></script>
</body>
</html>
