<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Template Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4/dist/index.global.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #030712; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .tab-active { border-color: #a855f7; color: #c084fc; background: rgba(168, 85, 247, 0.08); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        [x-cloak] { display: none !important; }
        .animate-fade { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        .large-text main { font-size: 1.08rem; }
        .large-text .text-xs { font-size: 0.82rem; }
        .large-text .text-sm { font-size: 0.98rem; }
        .calm-mode .animate-fade,
        .calm-mode .animate-pulse,
        .calm-mode .animate-spin { animation: none !important; }
        .focus-mode .focus-hide { display: none !important; }
        .diagram-grid {
            background:
                radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.12), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.10), transparent 28%),
                linear-gradient(to bottom right, rgba(17, 24, 39, 0.96), rgba(3, 7, 18, 0.98));
        }
        .diagram-node {
            transform: translate(-50%, -50%);
            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }
        @media print {
            body { background: #fff !important; color: #000 !important; }
            header, .no-print { display: none !important; }
            .cheat-card { break-inside: avoid; border: 1px solid #ccc !important; background: #fff !important; }
            .cheat-card * { color: #000 !important; }
            .cheat-accent { color: #6b21a8 !important; }
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen selection:bg-purple-500 selection:text-white bg-gray-950" x-data="engine" :class="{'large-text':ui.large,'calm-mode':ui.calm,'focus-mode':ui.focus}">

    <!-- HEADER -->
    <header class="border-b border-gray-800 bg-gray-900/40 backdrop-blur sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="h-3 w-3 rounded-full bg-purple-500 animate-pulse"></div>
                <h1 class="text-base font-bold tracking-wider text-gray-100 font-mono uppercase" x-text="course.meta.title"></h1>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-3">
                <div class="font-mono text-xs text-gray-500 focus-hide" x-text="course.meta.subtitle"></div>
                <div class="no-print flex items-center gap-1 rounded-lg border border-gray-800 bg-gray-950 p-1 font-mono text-[10px]">
                    <button @click="ui.focus=!ui.focus" :class="ui.focus?'bg-purple-700 text-white':'text-gray-400 hover:text-gray-200'" class="px-2 py-1 rounded">Focus</button>
                    <button @click="ui.large=!ui.large" :class="ui.large?'bg-purple-700 text-white':'text-gray-400 hover:text-gray-200'" class="px-2 py-1 rounded">Large</button>
                    <button @click="ui.calm=!ui.calm" :class="ui.calm?'bg-purple-700 text-white':'text-gray-400 hover:text-gray-200'" class="px-2 py-1 rounded">Calm</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- TAB NAV (generated from modules) -->
        <div class="flex border-b border-gray-800 overflow-x-auto scrollbar-hide mb-8 gap-1 font-mono text-xs">
            <template x-for="m in course.modules" :key="m.id">
                <button @click="tab=m.id" :class="tab===m.id?'tab-active':'border-transparent text-gray-400 hover:text-gray-200'" class="px-4 py-3 border-b-2 transition-all whitespace-nowrap" x-text="m.label"></button>
            </template>
        </div>

        <template x-for="m in course.modules" :key="m.id">
        <div x-show="tab===m.id" class="animate-fade" x-cloak>

            <!-- ===== OVERVIEW ===== -->
            <template x-if="m.type==='overview'">
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-purple-950/30 to-gray-900/60 border border-purple-900/40 p-6 rounded-xl">
                        <h3 x-show="m.data.kicker" class="text-xs font-bold tracking-widest text-purple-400 uppercase font-mono mb-2" x-text="'// '+m.data.kicker"></h3>
                        <h2 class="text-xl font-black text-white mb-3 tracking-tight" x-text="m.data.headline"></h2>
                        <p class="text-gray-300 leading-relaxed text-sm max-w-4xl" x-text="m.data.body"></p>
                    </div>
                    <div x-show="m.data.cards && m.data.cards.length" class="grid md:grid-cols-3 gap-6 text-sm">
                        <template x-for="(c,ci) in (m.data.cards||[])" :key="ci">
                            <div class="bg-gray-900/60 border border-gray-800 p-5 rounded-xl space-y-2">
                                <div class="text-purple-400 font-mono font-bold text-[11px]" x-text="c.tag"></div>
                                <h4 class="font-bold text-white" x-text="c.title"></h4>
                                <p class="text-gray-400 leading-relaxed" x-text="c.text"></p>
                            </div>
                        </template>
                    </div>
                    <div x-show="m.data.steps && m.data.steps.length" class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-3">
                        <h3 x-show="m.data.stepsTitle" class="text-sm font-bold text-white font-mono uppercase tracking-wide" x-text="m.data.stepsTitle"></h3>
                        <div class="flex flex-wrap items-center gap-2 text-[11px] font-mono">
                            <template x-for="(s,si) in (m.data.steps||[])" :key="si">
                                <span class="flex items-center gap-2">
                                    <span class="px-2.5 py-1 rounded bg-purple-950 text-purple-300 border border-purple-900/50" x-text="s"></span>
                                    <span x-show="si < m.data.steps.length-1" class="text-gray-600">→</span>
                                </span>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ===== CONCEPT CARDS (expandable) ===== -->
            <template x-if="m.type==='concept_cards'">
                <div class="space-y-4">
                    <div x-show="m.data.intro" class="bg-gray-900 border border-gray-800 rounded-xl p-5">
                        <p class="text-xs text-gray-400 leading-relaxed" x-text="m.data.intro"></p>
                    </div>
                    <template x-for="(c,ci) in m.data.cards" :key="ci">
                        <details class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden group" :open="ci===0">
                            <summary class="p-4 flex items-center justify-between hover:bg-gray-900/60 transition">
                                <div class="flex items-center gap-3">
                                    <span x-show="c.badge" class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-purple-950 text-purple-300" x-text="c.badge"></span>
                                    <span class="font-bold text-white text-sm" x-text="c.name"></span>
                                </div>
                                <span class="text-gray-600 font-mono text-xs group-open:rotate-90 transition-transform">▶</span>
                            </summary>
                            <div class="px-4 pb-5 pt-1 space-y-3 text-xs border-t border-gray-800/60">
                                <template x-for="(f,fi) in c.fields" :key="fi">
                                    <div><span class="uppercase tracking-wider text-[10px] font-mono block mb-0.5" :class="toneClass(f.tone)" x-text="f.label"></span><p class="text-gray-300 leading-relaxed" x-text="f.text"></p></div>
                                </template>
                                <div x-show="c.highlight" class="bg-amber-950/20 border border-amber-900/40 rounded-lg p-3">
                                    <span class="text-amber-400 uppercase tracking-wider text-[10px] font-mono block mb-1" x-text="(c.highlight&&c.highlight.label)||'Watch out'"></span>
                                    <p x-show="c.highlight&&c.highlight.q" class="text-amber-200/90 leading-relaxed italic mb-1" x-text="c.highlight&&c.highlight.q"></p>
                                    <p class="text-gray-300 leading-relaxed" x-text="c.highlight&&c.highlight.a"></p>
                                </div>
                            </div>
                        </details>
                    </template>
                </div>
            </template>

            <!-- ===== FLASHCARDS ===== -->
            <template x-if="m.type==='flashcards'">
                <div class="space-y-6" x-init="recordReview()">
                    <div class="max-w-2xl mx-auto bg-gray-900/50 border border-gray-800 rounded-xl p-4 flex items-center justify-between gap-6 font-mono text-xs">
                        <span class="text-gray-400">Progress:</span>
                        <div class="flex-1 h-2 bg-gray-950 rounded-full overflow-hidden border border-gray-800">
                            <div class="h-full bg-gradient-to-r from-purple-600 to-fuchsia-500 transition-all" :style="'width:'+(S[m.id].mastered.length/m.data.cards.length*100)+'%'"></div>
                        </div>
                        <span class="text-purple-300 font-bold" x-text="S[m.id].mastered.length+'/'+m.data.cards.length"></span>
                    </div>
                    <div class="max-w-2xl mx-auto flex items-center justify-center gap-6 font-mono text-[11px] text-gray-500">
                        <span>🔥 Streak: <span class="text-amber-400 font-bold" x-text="streak"></span></span>
                        <span>Last: <span class="text-gray-300" x-text="lastReviewedLabel"></span></span>
                    </div>
                    <div class="max-w-2xl mx-auto bg-gray-900 border border-gray-800 rounded-xl p-6 text-center space-y-6">
                        <div class="flex justify-between items-center text-xs font-mono uppercase tracking-widest text-purple-400">
                            <span>Flashcards</span>
                            <span x-text="'Card '+(S[m.id].ci+1)+' of '+m.data.cards.length"></span>
                        </div>
                        <div class="min-h-[150px] flex items-center justify-center px-4">
                            <p class="leading-relaxed text-white transition-all" :class="S[m.id].ans?'text-gray-300 text-sm text-left bg-gray-950 p-4 rounded-lg border border-gray-800':'text-base font-medium'" x-text="S[m.id].ans?m.data.cards[S[m.id].ci].a:m.data.cards[S[m.id].ci].q"></p>
                        </div>
                        <div class="pt-4 border-t border-gray-800 flex justify-between items-center font-mono text-xs">
                            <button @click="S[m.id].ans=!S[m.id].ans" class="bg-gray-800 hover:bg-gray-700 font-bold px-4 py-2 rounded" x-text="S[m.id].ans?'Show question':'Reveal answer'"></button>
                            <div class="flex gap-2">
                                <button @click="fcMaster(m)" :class="S[m.id].mastered.includes(S[m.id].ci)?'bg-emerald-950 border border-emerald-500/40 text-emerald-300':'bg-gray-900 border border-gray-800 text-gray-400'" class="px-3 py-2 rounded font-bold" x-text="S[m.id].mastered.includes(S[m.id].ci)?(course.meta.learner==='kid'?'✓ Got it!':'✓ Mastered'):(course.meta.learner==='kid'?'Got it!':'Mark mastered')"></button>
                                <button @click="S[m.id].ans=false; S[m.id].ci=(S[m.id].ci+1)%m.data.cards.length" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded font-bold text-white">Next ➔</button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ===== VISUAL MAP ===== -->
            <template x-if="m.type==='visual_map'">
                <div class="space-y-5">
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
                        <h3 class="text-sm font-bold text-white font-mono uppercase tracking-wide" x-text="m.data.title||'Concept map'"></h3>
                        <p x-show="m.data.intro" class="text-xs text-gray-400 mt-1 leading-relaxed" x-text="m.data.intro"></p>
                    </div>
                    <div class="grid lg:grid-cols-[1.2fr_0.8fr] gap-5 items-start">
                        <div class="space-y-3">
                            <div class="diagram-grid relative overflow-hidden rounded-2xl border border-gray-800 min-h-[28rem]">
                                <svg class="absolute inset-0 h-full w-full pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                                    <defs>
                                        <linearGradient :id="'mapLine-'+m.id" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" stop-color="#a855f7" stop-opacity="0.75"></stop>
                                            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.55"></stop>
                                        </linearGradient>
                                    </defs>
                                    <template x-for="(link,li) in visualLayout(m).links" :key="li">
                                        <g>
                                            <line :x1="link.from.x" :y1="link.from.y" :x2="link.to.x" :y2="link.to.y"
                                                  :stroke="'url(#mapLine-'+m.id+')'" stroke-width="0.8" stroke-linecap="round"
                                                  stroke-dasharray="0" opacity="0.9"></line>
                                            <text x="50" y="50" fill="transparent"></text>
                                        </g>
                                    </template>
                                </svg>
                                <template x-for="(node,ni) in visualLayout(m).nodes" :key="node.id||ni">
                                    <div class="diagram-node absolute w-[42%] sm:w-[30%] lg:w-[26%] max-w-[18rem] bg-gray-950/95 border rounded-2xl p-4 backdrop-blur"
                                         :class="['border-purple-900/50','border-emerald-900/50','border-amber-900/50','border-blue-900/50','border-rose-900/50'][ni%5]"
                                         :style="'left:'+node.x+'%;top:'+node.y+'%;'">
                                        <div class="flex items-start justify-between gap-3 mb-2">
                                            <span x-show="node.tag" class="text-[10px] font-mono uppercase tracking-widest px-2 py-0.5 rounded bg-gray-900 border border-gray-800 text-gray-400" x-text="node.tag"></span>
                                            <span class="h-2.5 w-2.5 rounded-full mt-1.5" :class="['bg-purple-400','bg-emerald-400','bg-amber-400','bg-blue-400','bg-rose-400'][ni%5]"></span>
                                        </div>
                                        <h4 class="font-bold text-white text-sm leading-tight" x-text="node.label"></h4>
                                        <p class="text-xs text-gray-400 leading-relaxed mt-2" x-text="node.summary"></p>
                                    </div>
                                </template>
                            </div>
                            <p class="text-[11px] font-mono text-gray-500 leading-relaxed">
                                Diagram reading tip: follow the arrows as a relationship story, not as isolated vocabulary.
                            </p>
                        </div>
                        <div class="bg-gray-950 border border-gray-800 rounded-xl p-4 space-y-3">
                            <div class="text-[10px] font-mono uppercase tracking-widest text-purple-400">Relationship notes</div>
                            <template x-for="(link,li) in (m.data.links||[])" :key="li">
                                <div class="rounded-lg border border-gray-800 bg-gray-900 p-3 text-xs space-y-1.5">
                                    <div class="flex items-center gap-2 text-gray-200">
                                        <span class="font-semibold" x-text="mapNode(m, link.from)"></span>
                                        <span class="text-purple-400 font-mono">→</span>
                                        <span class="font-semibold" x-text="mapNode(m, link.to)"></span>
                                    </div>
                                    <p x-show="link.label" class="text-gray-500 leading-relaxed" x-text="link.label"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ===== DRAG / SORT PRACTICE ===== -->
            <template x-if="m.type==='drag_sort'">
                <div class="space-y-5">
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <h3 class="text-sm font-bold text-white font-mono uppercase tracking-wide" x-text="m.data.title||'Sort the ideas'"></h3>
                            <p x-show="m.data.intro" class="text-xs text-gray-400 mt-1 leading-relaxed" x-text="m.data.intro"></p>
                        </div>
                        <div class="flex items-center gap-2 font-mono text-xs">
                            <span x-show="S[m.id].done" class="text-emerald-400 font-bold" x-text="sortScore(m)+'/'+(m.data.items||[]).length"></span>
                            <button @click="sortReset(m)" class="bg-gray-800 hover:bg-gray-700 px-3 py-2 rounded font-bold text-gray-200">Reset</button>
                        </div>
                    </div>
                    <div class="grid lg:grid-cols-[0.8fr_1.2fr] gap-5">
                        <div class="space-y-2">
                            <div class="text-[10px] font-mono uppercase tracking-widest text-gray-500">Unsorted</div>
                            <template x-for="item in sortAvailable(m)" :key="item.id">
                                <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-xs space-y-2">
                                    <div class="font-bold text-white" x-text="item.label"></div>
                                    <p x-show="item.detail" class="text-gray-500 leading-relaxed" x-text="item.detail"></p>
                                    <div class="flex flex-wrap gap-1.5">
                                        <template x-for="bucket in (m.data.buckets||[])" :key="bucket.id">
                                            <button @click="sortAssign(m,item,bucket.id)" class="px-2 py-1 rounded bg-purple-950/40 border border-purple-900/50 text-purple-200 font-mono text-[10px]" x-text="bucket.label"></button>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <p x-show="!sortAvailable(m).length" class="text-xs text-gray-500 bg-gray-950 border border-gray-800 rounded-lg p-3">All items are placed.</p>
                        </div>
                        <div class="grid sm:grid-cols-2 gap-3">
                            <template x-for="bucket in (m.data.buckets||[])" :key="bucket.id">
                                <div class="bg-gray-950 border border-gray-800 rounded-xl p-3 min-h-[180px]">
                                    <div class="mb-3">
                                        <h4 class="text-xs font-bold text-white font-mono uppercase tracking-wide" x-text="bucket.label"></h4>
                                        <p x-show="bucket.hint" class="text-[11px] text-gray-500 mt-0.5" x-text="bucket.hint"></p>
                                    </div>
                                    <div class="space-y-2">
                                        <template x-for="item in sortBucketItems(m,bucket.id)" :key="item.id">
                                            <button @click="sortUnassign(m,item)" class="w-full text-left rounded-lg border p-3 text-xs"
                                                :class="S[m.id].done ? (item.bucket===bucket.id?'border-emerald-600 bg-emerald-950/20':'border-red-600 bg-red-950/20') : 'border-gray-800 bg-gray-900 hover:bg-gray-800'">
                                                <span class="font-bold text-gray-100" x-text="item.label"></span>
                                                <span x-show="S[m.id].done && item.bucket!==bucket.id" class="block mt-1 text-red-300" x-text="'Belongs in '+sortBucketLabel(m,item.bucket)"></span>
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                    <button @click="sortCheck(m)" :disabled="Object.keys(S[m.id].assigned).length!==(m.data.items||[]).length" class="w-full bg-purple-600 hover:bg-purple-500 disabled:opacity-40 px-4 py-2.5 rounded font-mono font-bold text-xs text-white">Check sorting</button>
                </div>
            </template>

            <!-- ===== TEACH BACK ===== -->
            <template x-if="m.type==='teach_back'">
                <div class="space-y-5 max-w-3xl mx-auto">
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
                        <h3 class="text-sm font-bold text-white font-mono uppercase tracking-wide" x-text="m.data.title||'Teach it back'"></h3>
                        <p x-show="m.data.intro" class="text-xs text-gray-400 mt-1 leading-relaxed" x-text="m.data.intro"></p>
                    </div>
                    <template x-for="(prompt,pi) in (m.data.prompts||[])" :key="pi">
                        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-4">
                            <div class="flex items-start gap-3">
                                <span class="h-6 w-6 shrink-0 rounded bg-purple-700 text-white font-mono text-xs font-bold grid place-items-center" x-text="pi+1"></span>
                                <h4 class="text-sm font-bold text-white leading-relaxed" x-text="prompt.q"></h4>
                            </div>
                            <textarea x-model="S[m.id].answers[pi]" rows="4" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-gray-200 placeholder-gray-600 focus:border-purple-600 focus:outline-none" placeholder="Explain it in your own words."></textarea>
                            <button @click="teachToggle(m,pi)" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded font-mono font-bold text-xs text-gray-200" x-text="S[m.id].revealed[pi]?'Hide checklist':'Show checklist'"></button>
                            <div x-show="S[m.id].revealed[pi]" x-cloak class="grid md:grid-cols-2 gap-3 text-xs">
                                <div class="bg-gray-950 border border-gray-800 rounded-lg p-3">
                                    <div class="text-[10px] font-mono uppercase tracking-widest text-emerald-400 mb-2">Include these points</div>
                                    <ul class="space-y-1.5 text-gray-300 list-disc list-inside">
                                        <template x-for="(kp,ki) in (prompt.keyPoints||[])" :key="ki"><li x-text="kp"></li></template>
                                    </ul>
                                </div>
                                <div class="bg-gray-950 border border-gray-800 rounded-lg p-3">
                                    <div class="text-[10px] font-mono uppercase tracking-widest text-purple-400 mb-2">Model answer</div>
                                    <p class="text-gray-300 leading-relaxed" x-text="prompt.sample"></p>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- ===== NOTES ===== -->
            <template x-if="m.type==='notes'">
                <div class="space-y-5 max-w-4xl mx-auto">
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
                        <h3 class="text-sm font-bold text-white font-mono uppercase tracking-wide" x-text="m.data.title||'Study notes'"></h3>
                        <p x-show="m.data.intro" class="text-xs text-gray-400 mt-1 leading-relaxed" x-text="m.data.intro"></p>
                    </div>
                    <template x-for="(section,si) in (m.data.sections||[])" :key="si">
                        <details class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden" :open="si===0">
                            <summary class="p-4 flex items-center justify-between hover:bg-gray-900/60 transition">
                                <span class="font-bold text-white text-sm" x-text="section.heading"></span>
                                <span class="text-gray-600 font-mono text-xs">open</span>
                            </summary>
                            <div class="px-4 pb-5 pt-1 border-t border-gray-800/60 text-xs space-y-3">
                                <p x-show="section.summary" class="text-gray-300 leading-relaxed" x-text="section.summary"></p>

    document.addEventListener('alpine:init', () => {
        Alpine.data('engine', () => ({
            course: COURSE,
            tab: COURSE.modules[0].id,
            S: {},
            ui: { focus:false, large:false, calm:false },
            slug: (COURSE.meta.title||'course').toLowerCase().replace(/[^a-z0-9]+/g,'_'),

            init() {
                for (const m of this.course.modules) {
                    if (m.type === 'flashcards') {
                        const saved = JSON.parse(localStorage.getItem(this.slug+'_'+m.id+'_mastered') || '[]');
                        this.S[m.id] = { ci:0, ans:false, mastered:saved };
                    } else if (m.type === 'challenge') {
                        this.S[m.id] = { stage:0, pick:null, confirmed:false, score:0, history:[], timeLeft:0, timerRef:null };
                    } else if (m.type === 'sequence') {
                        this.S[m.id] = { modeKey:null, items:[], selected:[], done:false, perfect:false, correctOrder:[] };
                    } else if (m.type === 'drag_sort') {
                        this.S[m.id] = { assigned:{}, done:false };
                    } else if (m.type === 'teach_back') {
                        this.S[m.id] = { answers:{}, revealed:{} };
                    }
                }
            },

            // ---- shared helpers ----
            toneClass(t) {
                return ({neutral:'text-gray-500', good:'text-emerald-400', info:'text-blue-400',
                        alt:'text-blue-400', bad:'text-red-400', warn:'text-amber-400'})[t] || 'text-gray-500';
            },
            optLabel(o){ return (typeof o === 'string') ? o : o.label; },
            optDetail(o){ return (typeof o === 'object' && o) ? (o.detail||'') : ''; },
            mapNode(m, id) {
                const node = (m.data.nodes||[]).find(n => n.id === id);
                return node ? node.label : id;
            },
            visualLayout(m) {
                const nodes = (m.data.nodes || []).filter(Boolean);
                const count = nodes.length || 1;
                const radius = count <= 2 ? 0 : count <= 4 ? 28 : 33;
                const positions = nodes.map((node, i) => {
                    let x = 50;
                    let y = 50;
                    if (count === 1) {
                        x = 50; y = 50;
                    } else if (count === 2) {
                        x = i === 0 ? 28 : 72;
                        y = 50;
                    } else if (count === 3) {
                        const layout = [
                            { x: 50, y: 26 },
                            { x: 26, y: 72 },
                            { x: 74, y: 72 },
                        ];
                        x = layout[i].x; y = layout[i].y;
                    } else {
                        const angle = (-Math.PI / 2) + ((Math.PI * 2) * i / count);
                        x = 50 + Math.cos(angle) * radius;
                        y = 50 + Math.sin(angle) * radius * 0.78;
                    }
                    return { ...node, x: Number(x.toFixed(1)), y: Number(y.toFixed(1)) };
                });
                const byId = Object.fromEntries(positions.map(n => [n.id, n]));
                const links = (m.data.links || [])
                    .map(link => ({ ...link, from: byId[link.from], to: byId[link.to] }))
                    .filter(link => link.from && link.to);
                return { nodes: positions, links };
            },

            // ---- audio helpers ----
            speak(text) {
                if (!('speechSynthesis' in window) || !text) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = this.course.meta.learner === 'kid' ? 0.92 : 0.98;
                window.speechSynthesis.speak(u);
            },
            stopSpeech() {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            },

            // ---- spaced-repetition (shared across flashcard modules) ----
            recordReview() {
                const k = this.slug+'_review_dates';
                const d = JSON.parse(localStorage.getItem(k) || '[]');
                const today = new Date().toISOString().split('T')[0];
                if (!d.includes(today)) { d.push(today); localStorage.setItem(k, JSON.stringify(d)); }
            },
            get streak() {
                const d = JSON.parse(localStorage.getItem(this.slug+'_review_dates') || '[]');
                if (!d.length) return 0;
                let s = 1, cur = new Date(); cur.setHours(0,0,0,0);
                for (let i = d.length-1; i >= 0; i--) {
                    const rd = new Date(d[i]); rd.setHours(0,0,0,0);
                    const diff = (cur - rd) / 86400000;
                    if (diff <= 1) { if (diff === 1) s++; cur = rd; } else break;
                }
                return s;
            },
            get lastReviewedLabel() {
                const d = JSON.parse(localStorage.getItem(this.slug+'_review_dates') || '[]');
                if (!d.length) return 'never';
                const diff = Math.floor((Date.now() - new Date(d[d.length-1])) / 86400000);
                return diff===0 ? 'today' : diff===1 ? 'yesterday' : diff+' days ago';
            },

            // ---- flashcards ----
            fcMaster(m) {
                const st = this.S[m.id];
                st.mastered = st.mastered.includes(st.ci) ? st.mastered.filter(i=>i!==st.ci) : [...st.mastered, st.ci];
                localStorage.setItem(this.slug+'_'+m.id+'_mastered', JSON.stringify(st.mastered));
            },

            // ---- sorting practice ----
            sortAssign(m, item, bucketId) {
                const st = this.S[m.id];
                st.done = false;
                st.assigned = {...st.assigned, [item.id]: bucketId};
            },
            sortUnassign(m, item) {
                const st = this.S[m.id];
                if (st.done) return;
                const next = {...st.assigned};
                delete next[item.id];
                st.assigned = next;
            },
            sortReset(m) {
                this.S[m.id] = { assigned:{}, done:false };
            },
            sortCheck(m) {
                this.S[m.id].done = true;
                this.recordReview();
            },
            sortAvailable(m) {
                const assigned = this.S[m.id].assigned;
                return (m.data.items||[]).filter(item => !assigned[item.id]);
            },
            sortBucketItems(m, bucketId) {
                const assigned = this.S[m.id].assigned;
                return (m.data.items||[]).filter(item => assigned[item.id] === bucketId);
            },
            sortBucketLabel(m, bucketId) {
                const bucket = (m.data.buckets||[]).find(b => b.id === bucketId);
                return bucket ? bucket.label : bucketId;
            },
            sortScore(m) {
                const assigned = this.S[m.id].assigned;
                return (m.data.items||[]).filter(item => assigned[item.id] === item.bucket).length;
            },

            // ---- teach-back ----
            teachToggle(m, idx) {
                const st = this.S[m.id];
                st.revealed = {...st.revealed, [idx]: !st.revealed[idx]};
                this.recordReview();
            },

            // ---- sequence ----
            seqStart(m, key) {
                const st = this.S[m.id];
                const mode = m.data.modes.find(x => x.key === key);
                st.modeKey = key;
                st.items = [...mode.items].sort(() => Math.random()-0.5);
                st.correctOrder = mode.correct.map(id => mode.items.find(it => it.id === id));
                st.selected = []; st.done = false; st.perfect = false;
            },
            seqModeLabel(m) {
                const st = this.S[m.id];
                const mode = m.data.modes.find(x => x.key === st.modeKey);
                return mode ? mode.label : '';
            },
            seqCheck(m) {
                const st = this.S[m.id];
                st.done = true;
                st.perfect = st.selected.every((item,i) => item.id === st.correctOrder[i].id);
            },

            // ---- challenge (quiz / rounds / timed / classify) ----
            chStart(m) {
                const st = this.S[m.id];
                st.stage = 1; st.pick = null; st.confirmed = false; st.score = 0; st.history = [];
                if (m.data.kind === 'timed') this.chTimer(m);
            },
            chTimer(m) {
                const st = this.S[m.id];
                const r = m.data.rounds[st.stage-1];
                const dur = r.timer || m.data.timer || 30;
                st.timeLeft = dur;
                clearInterval(st.timerRef);
                st.timerRef = setInterval(() => {
                    st.timeLeft--;
                    if (st.timeLeft <= 0) {
                        clearInterval(st.timerRef);
                        if (!st.confirmed) { st.pick = -1; this.chConfirm(m); }
                    }
                }, 1000);
            },
            chPick(m, i) {
                const st = this.S[m.id];
                if (st.confirmed) return;
                st.pick = i;
                if (m.data.kind === 'timed') this.chConfirm(m);
            },
            chConfirm(m) {
                const st = this.S[m.id];
                if (st.confirmed || st.pick === null) return;
                clearInterval(st.timerRef);
                st.confirmed = true;
                const correct = st.pick === m.data.rounds[st.stage-1].correct;
                st.history.push(correct);
                if (correct) st.score++;
            },
            chAdvance(m) {
                const st = this.S[m.id];
                if (st.stage < m.data.rounds.length) {
                    st.stage++; st.pick = null; st.confirmed = false;
                    if (m.data.kind === 'timed') this.chTimer(m);
                } else {
                    st.stage = m.data.rounds.length + 1;
                    clearInterval(st.timerRef);
                    const k = this.slug+'_'+m.id+'_best';
                    const best = JSON.parse(localStorage.getItem(k) || 'null');
                    if (best === null || st.score > best) localStorage.setItem(k, st.score);
                    this.recordReview();
                }
            },
            chCorrect(m) {
                const st = this.S[m.id];
                return st.pick === m.data.rounds[st.stage-1].correct;
            },
            chFeedback(m) {
                const st = this.S[m.id];
                const r = m.data.rounds[st.stage-1];
                if (st.pick === -1) return r.exp || "Time ran out — review this one and try again.";
                if (r.exp) return r.exp;
                if (this.chCorrect(m)) return r.rightFeedback || "Correct!";
                return (r.wrongFeedback && r.wrongFeedback[st.pick]) || "Not quite — review and try again.";
            },
            chOptClass(m, oi) {
                const st = this.S[m.id];
                const r = m.data.rounds[st.stage-1];
                if (st.confirmed) {
                    if (oi === r.correct) return 'border-emerald-500 bg-emerald-950/20';
                    if (oi === st.pick) return 'border-red-500 bg-red-950/20';
                    return 'border-gray-800 bg-gray-950 opacity-50';
                }
                return st.pick === oi ? 'border-purple-500 bg-purple-950/20' : 'border-gray-800 bg-gray-950 hover:bg-gray-900';
            },
            bestScore(m) {
                return JSON.parse(localStorage.getItem(this.slug+'_'+m.id+'_best') || 'null');
            },
            resultMsg(m) {
                const st = this.S[m.id];
                const total = m.data.rounds.length;
                const pct = st.score / total;
                const kid = this.course.meta.learner === 'kid';
                if (pct === 1) return kid ? "Perfect! You really know this. 🌟" : "Perfect score — you've got this cold.";
                if (pct >= 0.7) return kid ? "Great job! Review the ones you missed and try again." : "Strong. Review the misses and run it again.";
                return kid ? "Good try! Look back at the cards, then give it another go. You'll get it!" : "Good start — review the material and retry.";
            },
        }));
    });
